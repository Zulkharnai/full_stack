<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="../utils/global.css" />
  </head>
  <body>
    <div id="game-video">
      <div>
        <dialog id="dialog">
          <h2>Game Over</h2>
          <div id="result">Your Score: <span id="final-score"></span></div>
          <button id="dialog-close">Close</button>
        </dialog>

        <div id="control">
          <img src="../assets/back.png" alt="pause" id="back" />
          <img src="../assets/restart.png" alt="restart" id="restart" />
          <img src="../assets/speaker.png" alt="pause" id="speaker" />
          <img src="../assets/mute.png" alt="pause" id="mute" />
        </div>

        <div id="div-game">
          <div id="game-board"><span id="score"></span></div>

          <div id="game-imges">
            <img
              src="../assets/animal-1.png"
              alt="animal 1"
              class="game-img"
              data-id="0"
            />
            <img
              src="../assets/animal-2.png"
              alt="animal 2"
              class="game-img"
              data-id="1"
            />
            <img
              src="../assets/animal-3.png"
              alt="animal 3"
              class="game-img"
              data-id="2"
            />
            <img
              src="../assets/animal-4.png"
              alt="animal 4"
              class="game-img"
              data-id="3"
            />
            <img
              src="../assets/animal-5.png"
              alt="animal 5"
              class="game-img"
              data-id="4"
            />
            <img
              src="../assets/animal-6.png"
              alt="animal 6"
              class="game-img"
              data-id="5"
            />
          </div>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
    <script src="../utils/global.js"></script>
  </body>
</html>
